# exp003: in-train CONTROL. ink_9um on PHerc Paris 4 / w00 with the exact training input pipeline.
# Purpose: (1) check that our inference setup (fp16, no-compile, hann) reproduces good quality on a
# segment the model was trained on; (2) learn which direction matches the training convention, to
# interpret exp002 (841 only worked reversed). This is NOT a generalization measure.
# Paris 4 = Scroll 1: EduceLab terms apply; no academic claims about Paris 4 (see LICENSES.md).
# Everything under "preregistered" was fixed BEFORE seeing any prediction.

experiment: exp003_paris4w00_ink9um_s42
runtime: kaggle-t4x2          # 1 GPU used. Internet on, notebook PRIVATE.

upstream:
  villa_commit: 0e14cf48c8cee74b11e5e40a9d1d520b74e35423
  python: "3.14"
  uv_sync_args: ["--frozen", "--extra", "models", "--no-install-package", "volume-cartographer"]

checkpoint:
  registry_key: ink_9um
  hf_repo: scrollprize/ink_9um
  hf_revision: 7109667e2607db1b90c37c8b09cb876ea7fe7bb1
  file: hybrid_3d2d-seed42/step-075000.pth      # 138 MB

data:
  scroll: PHercParis4
  segment: w00
  # Surface volume used for training (ink_9um dataset README): public 2.4 um render, read at level 2
  # (xy 9.6 um; z is NOT downsampled in any level: 109 planes of 2.4 um).
  volume:
    base_url: https://vesuvius-challenge-open-data.s3.us-east-1.amazonaws.com/PHercParis4/segments/20231016151002/surface-volumes/2.4um-0.22m-78keV-volume-20260411134726.zarr
    level: "2"
  # Training labels (21 slices, annotated only at channel 10), same grid as volume level 2.
  labels:
    base_url: https://huggingface.co/buckets/scrollprize/datasets/resolve/ink_9um/labels/aligned-scrollprizeorg-21slices/phercparis4-w00
    ink: phercparis4-w00_inklabels.zarr
    supervision: phercparis4-w00_supervision_mask.zarr
    channel: 10
  # Input = official recipe (prepare_9um_isotropic_input): 84 centered planes, mean of 4 -> 21 slices.
  input: {n_planes: 84, z_pool: 4, xy_pool: 1}
  # Window rule (same as exp002, adapted to the chunk grid): coverage of supervision >= min_coverage,
  # then max ink fraction; ties -> smallest (y, x). Selection is biased toward ink-dense areas.
  window: {size: 1024, stride: 128, min_coverage: 0.9}

inference:
  module: vesuvius.ink_detection.inference.infer
  base_args: ["--no-compile", "--batch-size", "8", "--overlap", "0.5", "--blend-mode", "hann",
              "--num-workers", "2", "--amp-dtype", "fp16", "--direction", "both"]
  depth_offsets: [-2, 0, 2]     # layers [2+k, 19+k) of the 21 slices

# ---------------------------------------------------------------- preregistered
evaluation:
  primary: {offset: 0, direction: forward}      # forward = training orientation
  eval_mask: supervision                        # no validation mask exists for Paris 4 segments
  beta: 0.5
  threshold_u8: 128
  rescale_check: {lo: 0.25, hi: 0.75}
  oracle_threshold: reported_as_optimistic
  bootstrap: {tile: 128, n: 2000, seed: 0}
  baseline: all_positive
  contamination_registry: configs/checkpoints.yaml
