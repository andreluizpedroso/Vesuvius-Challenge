# exp002: ink_9um on PHerc 0841 / w00 with the CORRECT depth input, plus first metrics.
# Replaces exp000 for evaluation (exp000 fed level 1 = wrong depth, see exp001 / memory notes).
# Everything below the "preregistered" marker was fixed BEFORE seeing any prediction.

experiment: exp002_841w00_ink9um_s42
runtime: kaggle-t4x2          # 1 GPU used. Internet on, notebook PRIVATE.

upstream:
  villa_commit: 0e14cf48c8cee74b11e5e40a9d1d520b74e35423
  python: "3.14"
  uv_sync_args: ["--frozen", "--extra", "models", "--no-install-package", "volume-cartographer"]

checkpoint:
  registry_key: ink_9um
  hf_repo: scrollprize/ink_9um
  hf_revision: 7109667e2607db1b90c37c8b09cb876ea7fe7bb1
  file: hybrid_3d2d-seed42/step-075000.pth      # 138 MB

data:
  scroll: PHerc0841
  segment: w00
  base_url: https://huggingface.co/buckets/scrollprize/datasets/resolve/ink/841/w00
  volume: w00.zarr
  labels:
    ink: w00_inklabels_v2.zarr
    supervision: w00_supervision_mask_v2.zarr
    validation: w00_validation_mask_v2.zarr
  # Same area as exp000 (level-1 y 5504:6528, x 5248:6272), expressed at level 0.
  window_l0: {y0: 11008, x0: 10496, size: 2048}
  # Input construction, from level 0 ONLY (levels >= 1 are z-truncated, not pooled; exp001).
  # xy: 2x2 mean; z: mean of 2 planes over 42 centered planes -> 21 slices at ~9.36 um,
  # centered on the surface plane z=32 (labels live at z=32). Single rounding at the end.
  input:
    n_planes: 42
    xy_pool: 2
    z_pool: 2
    label_plane: 32
    sanity_min_corr: 0.9          # level1[i] vs xy-pooled level0[i] (1:1 z mapping)
  # Ground truth on the 9.36 um grid (2x2 blocks of the level-0 z=32 label plane):
  #   ink = block mean >= 0.5 ; supervised/validated = all 4 sub-pixels set.
  gt: {ink_min_fraction: 0.5, mask_requires_all: true}

inference:
  module: vesuvius.ink_detection.inference.infer
  # fp16 forced (T4 has no native bf16). input_depth=17 is read from the checkpoint.
  base_args: ["--no-compile", "--batch-size", "8", "--overlap", "0.5", "--blend-mode", "hann",
              "--num-workers", "2", "--amp-dtype", "fp16", "--direction", "both"]
  # Depth window = layers [2+k, 19+k) of the 21 slices; k=0 is the default centered window.
  depth_offsets: [-2, 0, 2]

# ---------------------------------------------------------------- preregistered
evaluation:
  primary: {offset: 0, direction: forward}      # direction/offset others = sensitivity only
  eval_mask: supervision_and_validation
  beta: 0.5                                     # F0.5
  threshold_u8: 128                             # v/255 >= 0.5 (== rescaled (p-0.25)/0.5 >= 0.5)
  rescale_check: {lo: 0.25, hi: 0.75}           # label-smoothing targets; shown identical to raw 0.5
  oracle_threshold: reported_as_optimistic      # argmax F0.5 over all uint8 levels, same pixels
  bootstrap: {tile: 128, n: 2000, seed: 0}      # tile bootstrap over 128x128 tiles, 95% CI
  baseline: all_positive                        # context for a high ink prevalence
  contamination_registry: configs/checkpoints.yaml
