# exp008: build the ink_9um 'aligned' training corpus ONCE (24 segments: PHerc 0139, 0814, 1667, Paris 4)
# as a sparse 21-slice 9.6 um layout, on CPU-only Kaggle notebooks. The output of each notebook is
# attached (as a private notebook output) to the later training notebooks.
# Per segment: labels = byte-exact copies of the non-empty chunks; surface-volume.zarr = 84 centered planes of the
# 2.4 um level-2 volume, mean of 4 -> 21 slices (official recipe), only for chunks within `chunk_margin` of any
# non-empty label chunk (patches are drawn on supervised areas and extend < 128 px beyond them).
# Volume URLs come from the ink_9um dataset README (segment -> public surface volume). The 5 native 9.362 um
# PHerc 0139 segments of the official recipe are NOT included (documented deviation of the reproduction).

experiment: exp008_corpus
runtime: kaggle-cpu           # CPU only (no GPU quota). Internet on, notebooks PRIVATE.

data:
  labels_root: https://huggingface.co/buckets/scrollprize/datasets/resolve/ink_9um/labels/aligned-scrollprizeorg-21slices
  tree_root: https://huggingface.co/api/buckets/scrollprize/datasets/tree/ink_9um/labels/aligned-scrollprizeorg-21slices
  volume_level: "2"
  input: {n_planes: 84, z_pool: 4}
  chunk_margin: 1
  hf_min_interval_s: 0.2        # <= 5 requests/s to huggingface.co per notebook (HTTP 429 otherwise)
  retry_rounds: 3

pip: ["zarr==3.2.1", "numcodecs==0.16.5", "pyyaml"]

groups:                         # two notebooks so each stays short (est. 17 min and 35 min at ~12 MB/s)
  A: [pherc0139, pherc0814, pherc1667]     # ~6.9k volume chunks, ~12 GB
  B: [phercparis4]                         # ~12.2k volume chunks, ~22 GB

segments:
  - {key: pherc0139-w016, volume_url: "https://vesuvius-challenge-open-data.s3.us-east-1.amazonaws.com/PHerc0139/segments/20250108000004-w029_2025010827/surface-volumes/2.399um-0.22m-78keV-volume-20260102150214.zarr"}
